<style>
/* ============================================================
   Gym Ranker 3 — Design System
   ============================================================ */
:root{
  color-scheme:dark;
  --bg:#000;--bg-2:#08080a;--surface:#111113;--surface-2:#1a1a1d;--surface-3:#252529;--surface-4:#323237;
  --line:rgba(255,255,255,.07);--line-2:rgba(255,255,255,.12);
  --text:#f5f5f7;--text-2:#a1a1a8;--text-3:#68686f;
  --accent:#ff4d2e;--accent-2:#ff8a3d;--accent-ink:#fff;--accent-soft:rgba(255,77,46,.14);--accent-glow:rgba(255,77,46,.38);
  --good:#30d158;--warn:#ffb340;--bad:#ff453a;--gold:#ffc83d;
  --good-soft:rgba(48,209,88,.14);--warn-soft:rgba(255,179,64,.14);--bad-soft:rgba(255,69,58,.15);
  --glass:rgba(22,22,24,.8);--glass-line:rgba(255,255,255,.09);
  --seg-ind:#3a3a3f;
  --shadow-1:0 1px 0 rgba(255,255,255,.035) inset,0 10px 30px rgba(0,0,0,.35);
  --shadow-2:0 30px 80px rgba(0,0,0,.65);
  --r-xl:28px;--r-lg:22px;--r-md:16px;--r-sm:12px;--r-xs:8px;
  --ease:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.34,1.56,.64,1);--ease-io:cubic-bezier(.65,0,.35,1);
  --tab-h:64px;--side-w:256px;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Inter","Segoe UI Variable Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --tier:#ff4d2e;
}
:root[data-theme=light]{
  color-scheme:light;
  --bg:#f2f2f6;--bg-2:#ebebf0;--surface:#fff;--surface-2:#f3f3f6;--surface-3:#e6e6eb;--surface-4:#d8d8de;
  --line:rgba(0,0,0,.06);--line-2:rgba(0,0,0,.1);
  --text:#1d1d1f;--text-2:#6e6e73;--text-3:#a1a1a6;
  --accent:#f03c1d;--accent-2:#ff6a2f;--accent-soft:rgba(240,60,29,.1);--accent-glow:rgba(240,60,29,.28);
  --good:#1fa64a;--warn:#c97a00;--bad:#e5302a;--gold:#c98f00;
  --good-soft:rgba(31,166,74,.11);--warn-soft:rgba(201,122,0,.11);--bad-soft:rgba(229,48,42,.1);
  --glass:rgba(255,255,255,.8);--glass-line:rgba(0,0,0,.07);
  --seg-ind:#fff;
  --shadow-1:0 1px 2px rgba(0,0,0,.04),0 8px 28px rgba(0,0,0,.05);
  --shadow-2:0 30px 80px rgba(0,0,0,.2);
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--bg);overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;-webkit-tap-highlight-color:transparent;min-height:100dvh;overflow-x:hidden;font-feature-settings:"ss01","cv11"}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
svg{display:block}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.ico.sm{width:18px;height:18px}.ico.xs{width:15px;height:15px;stroke-width:2.2}.ico.lg{width:26px;height:26px}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
[hidden]{display:none!important}
.ex-name,.ex-meta,.picker-name,.picker-sub{display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}
::selection{background:var(--accent-soft)}
body.locked{overflow:hidden}

/* ---------- Splash ---------- */
#splash{position:fixed;inset:0;z-index:999;background:var(--bg);display:grid;place-items:center;transition:opacity .5s var(--ease),visibility .5s}
#splash.out{opacity:0;visibility:hidden}
#splash.out .splash-logo{transform:scale(1.18);filter:blur(6px)}
.splash-logo{width:92px;height:92px;transition:transform .6s var(--ease),filter .6s var(--ease)}
.splash-logo .lg-shield{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .9s var(--ease-io) forwards}
.splash-logo .lg-chev{opacity:0;transform:translateY(8px);transform-box:fill-box;animation:chevIn .5s var(--spring) forwards}
.splash-logo .c1{animation-delay:.42s}.splash-logo .c2{animation-delay:.54s}.splash-logo .c3{animation-delay:.66s}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes chevIn{to{opacity:1;transform:none}}

/* ---------- Layout ---------- */
.main{max-width:600px;margin:0 auto;padding:calc(var(--safe-t) + 14px) 16px calc(var(--tab-h) + var(--safe-b) + 44px);transform-origin:50% 0;transition:transform .45s var(--ease),filter .45s var(--ease),border-radius .45s var(--ease)}
.page{display:none}
.page.active{display:block}
.page.in>*{animation:rise .6s var(--ease) both;animation-delay:calc(var(--i,0)*55ms)}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
.stack{display:flex;flex-direction:column;gap:14px}
.col{display:contents}

/* page header */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:10px 4px 18px;min-height:64px}
.ph-eyebrow{font-size:13px;font-weight:600;color:var(--text-2);letter-spacing:.01em;margin-bottom:2px;text-transform:capitalize}
.ph-title{margin:0;font-size:34px;line-height:1.08;font-weight:800;letter-spacing:-.028em}
.ph-actions{display:flex;gap:8px;align-items:center}

/* compact nav bar on scroll */
.navbar{position:fixed;top:0;left:0;right:0;z-index:40;height:calc(var(--safe-t) + 48px);padding-top:var(--safe-t);display:flex;align-items:center;justify-content:center;font-weight:650;font-size:16px;letter-spacing:-.01em;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--glass-line);opacity:0;transform:translateY(-6px);pointer-events:none;transition:opacity .25s var(--ease),transform .35s var(--ease)}
.navbar.show{opacity:1;transform:none}

/* ---------- Cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xl);padding:20px;box-shadow:var(--shadow-1);position:relative}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.card-title{margin:0;font-size:17px;font-weight:700;letter-spacing:-.015em}
.card-sub{font-size:13px;color:var(--text-2);font-weight:500}
.eyebrow{font-size:12px;font-weight:650;color:var(--text-2);letter-spacing:.06em;text-transform:uppercase}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:26px 6px 10px;font-size:13px;font-weight:650;color:var(--text-2);letter-spacing:.04em;text-transform:uppercase}
.muted{color:var(--text-2)}.dim{color:var(--text-3)}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 20px;border-radius:var(--r-md);font-weight:650;font-size:16px;letter-spacing:-.01em;transition:transform .25s var(--ease),background-color .2s,box-shadow .25s,opacity .2s;user-select:none;-webkit-user-select:none;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--accent);color:var(--accent-ink);box-shadow:0 10px 26px -8px var(--accent-glow)}
.btn-secondary{background:var(--surface-2);color:var(--text);border:1px solid var(--line)}
.btn-ghost{color:var(--accent);height:40px;padding:0 12px}
.btn-danger{background:var(--bad-soft);color:var(--bad)}
.btn-block{width:100%}
.btn-sm{height:36px;padding:0 14px;font-size:14px;border-radius:var(--r-sm)}
.icon-btn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--text-2);transition:transform .25s var(--ease),background .2s,color .2s}
.icon-btn:active{transform:scale(.9)}
@media (hover:hover){.btn-primary:hover{filter:brightness(1.07)}.btn-secondary:hover{background:var(--surface-3)}.icon-btn:hover{color:var(--text);background:var(--surface-3)}}

.chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);color:var(--text-2);font-size:14px;font-weight:600;white-space:nowrap;transition:background .2s,color .2s,border-color .2s,transform .25s var(--ease);flex-shrink:0}
.chip:active{transform:scale(.95)}
.chip.on{background:var(--text);color:var(--bg);border-color:transparent}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--c,var(--accent))}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 4px;margin:0 -2px;scroll-snap-type:x proximity;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 24px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 24px),transparent)}
.chips::-webkit-scrollbar{display:none}
.chips>*{scroll-snap-align:start}

.pill{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:99px;font-size:12px;font-weight:700;letter-spacing:.01em;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.accent{background:var(--accent-soft);color:var(--accent)}.pill.gold{background:color-mix(in srgb,var(--gold) 16%,transparent);color:var(--gold)}
.pill.neutral{background:var(--surface-2);color:var(--text-2)}
.pulse-dot{width:7px;height:7px;border-radius:50%;background:currentColor;position:relative}
.pulse-dot::after{content:"";position:absolute;inset:0;border-radius:50%;background:currentColor;animation:ping 1.8s var(--ease) infinite}
@keyframes ping{0%{transform:scale(1);opacity:.6}80%,100%{transform:scale(2.8);opacity:0}}

/* ---------- Inputs ---------- */
.search{position:relative;display:flex;align-items:center}
.search .ico{position:absolute;left:14px;color:var(--text-3);pointer-events:none}
.search input{width:100%;height:46px;border-radius:var(--r-md);border:1px solid transparent;background:var(--surface-2);padding:0 40px 0 44px;font-size:16px;outline:none;transition:border-color .2s,background .2s,box-shadow .2s}
.search input::placeholder{color:var(--text-3)}
.search input:focus{border-color:color-mix(in srgb,var(--accent) 50%,transparent);box-shadow:0 0 0 4px var(--accent-soft);background:var(--surface)}
.search .clear{position:absolute;right:8px;width:30px;height:30px;border-radius:50%;display:none;place-items:center;color:var(--text-3)}
.search.has .clear{display:grid}
.input{width:100%;height:50px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--surface-2);padding:0 16px;font-size:16px;outline:none;transition:border-color .2s,box-shadow .2s}
.input:focus{border-color:color-mix(in srgb,var(--accent) 50%,transparent);box-shadow:0 0 0 4px var(--accent-soft)}
textarea.input{height:110px;padding:12px 16px;resize:none;font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:12px;line-height:1.5}
.label{display:block;font-size:13px;font-weight:600;color:var(--text-2);margin:0 4px 8px}
.form-row{margin-bottom:16px}

/* ---------- Segmented control ---------- */
.seg{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-3);padding:3px;border-radius:12px;isolation:isolate;min-width:0}
.seg button{position:relative;z-index:1;height:32px;padding:0 10px;border-radius:9px;font-size:13px;font-weight:600;color:var(--text-2);transition:color .25s;white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:6px}
.seg button.on{color:var(--text)}
.seg .seg-ind{position:absolute;z-index:0;top:3px;bottom:3px;left:0;border-radius:9px;background:var(--seg-ind);box-shadow:0 3px 10px rgba(0,0,0,.14),0 0 0 .5px rgba(0,0,0,.04);transition:transform .45s var(--ease),width .45s var(--ease)}
.seg.lg button{height:38px;font-size:14px}

/* ---------- Switch ---------- */
.switch{position:relative;width:51px;height:31px;flex-shrink:0}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:99px;background:var(--surface-4);transition:background .3s var(--ease)}
.switch span::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.2),0 1px 1px rgba(0,0,0,.12);transition:transform .4s var(--spring),width .2s var(--ease)}
.switch input:checked+span{background:var(--good)}
.switch input:checked+span::after{transform:translateX(20px)}
.switch input:active+span::after{width:32px}
.switch input:checked:active+span::after{transform:translateX(15px)}

/* ---------- Hero / rank ---------- */
.hero{overflow:hidden;cursor:pointer;padding:22px;background:radial-gradient(120% 90% at 0% 0%,color-mix(in srgb,var(--tier) 24%,transparent),transparent 62%),radial-gradient(80% 80% at 100% 100%,color-mix(in srgb,var(--tier) 9%,transparent),transparent 70%),var(--surface);transition:transform .35s var(--ease),--tier .8s}
.hero:active{transform:scale(.985)}
.hero::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.07) 45%,transparent 60%);transform:translateX(-100%);animation:sheen 5.5s var(--ease-io) 1.2s infinite}
@keyframes sheen{0%{transform:translateX(-100%)}30%,100%{transform:translateX(100%)}}
.hero-top{display:flex;align-items:center;gap:18px}
.hero-emblem{position:relative;width:108px;height:108px;flex-shrink:0;display:grid;place-items:center}
.hero-emblem .ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--surface-3);stroke-width:5}
.ring-fg{fill:none;stroke:var(--tier);stroke-width:5;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100;transition:stroke-dashoffset 1.4s var(--ease),stroke .6s;filter:drop-shadow(0 0 6px color-mix(in srgb,var(--tier) 60%,transparent))}
#heroEmblem{width:70px;height:70px;animation:float 6s var(--ease-io) infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.hero-info{min-width:0;flex:1}
.hero-rank{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin:4px 0 6px;color:var(--tier);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero-rank.fire,.tier-fire{background:linear-gradient(90deg,#ffd54a,#ff6a1f,#ff2d2d,#ffd54a);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:fire 3s linear infinite}
@keyframes fire{to{background-position:300% 0}}
.hero-xp{font-size:15px;font-weight:600;color:var(--text-2)}
.hero-xp b{color:var(--text);font-size:20px;font-weight:750;letter-spacing:-.02em}
.bar{height:8px;border-radius:99px;background:var(--surface-3);overflow:hidden;margin:20px 0 12px}
.bar i{display:block;height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,color-mix(in srgb,var(--tier) 70%,#000),var(--tier));transition:width 1.4s var(--ease);box-shadow:0 0 14px color-mix(in srgb,var(--tier) 55%,transparent)}
.hero-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;color:var(--text-2);font-weight:550}
.hero-foot>span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hero-chev{color:var(--text-3);align-self:flex-start;margin-top:4px}

.streak-pill{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px 0 10px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-weight:750;font-size:15px;box-shadow:var(--shadow-1);transition:transform .25s var(--ease)}
.streak-pill:active{transform:scale(.94)}
.streak-pill .ico{color:var(--accent)}
.streak-pill.cold .ico{color:var(--text-3)}
.streak-pill.hot .ico{animation:flick 1.6s ease-in-out infinite}
@keyframes flick{0%,100%{transform:scale(1) rotate(0)}30%{transform:scale(1.08) rotate(-4deg)}60%{transform:scale(.96) rotate(3deg)}}

/* ---------- Logger ---------- */
.picker{width:100%;display:flex;align-items:center;gap:12px;min-height:64px;padding:10px 14px 10px 10px;border-radius:var(--r-md);background:var(--surface-2);border:1px solid var(--line);text-align:left;transition:transform .25s var(--ease),background .2s,border-color .2s}
.picker:active{transform:scale(.985)}
@media (hover:hover){.picker:hover{background:var(--surface-3)}}
.picker .ph-ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex-shrink:0}
.picker-main{flex:1;min-width:0}
.picker-name{font-weight:650;font-size:16px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.picker-sub{font-size:13px;color:var(--text-2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.picker.unset .picker-name{color:var(--text-2);font-weight:550}
.picker kbd{font:600 11px/1 var(--font);color:var(--text-3);border:1px solid var(--line-2);border-radius:6px;padding:4px 6px;display:none}
@media (hover:hover) and (pointer:fine){.picker kbd{display:inline-block}}
.recent{margin-top:12px}
.recent:empty{display:none}
.steppers{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.field label{display:block;font-size:12px;font-weight:650;color:var(--text-2);margin:0 4px 7px;letter-spacing:.04em;text-transform:uppercase}
.stepper{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;height:68px;border-radius:var(--r-md);background:var(--surface-2);border:1px solid var(--line);transition:border-color .2s,box-shadow .2s}
.stepper:focus-within{border-color:color-mix(in srgb,var(--accent) 50%,transparent);box-shadow:0 0 0 4px var(--accent-soft)}
.stepper button{height:100%;display:grid;place-items:center;color:var(--text-2);border-radius:var(--r-md);transition:color .2s,transform .2s var(--ease);touch-action:manipulation}
.stepper button:active{transform:scale(.85);color:var(--accent)}
.stepper input{width:100%;min-width:0;border:0;background:transparent;outline:none;text-align:center;font-size:28px;font-weight:750;letter-spacing:-.03em;font-variant-numeric:tabular-nums;padding:0}
.stepper input::placeholder{color:var(--text-3)}
.preview{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:40px;margin:12px 4px 8px;font-size:14px;color:var(--text-2);font-weight:550}
.preview .xp{font-size:22px;font-weight:800;color:var(--text);letter-spacing:-.025em}
.preview .xp small{font-size:13px;color:var(--text-2);font-weight:650;margin-left:3px}
.preview .tags{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.btn-log{width:100%;height:58px;font-size:17px;font-weight:700;position:relative;overflow:hidden;border-radius:18px}
.btn-log .btn-check{position:absolute;width:26px;height:26px;opacity:0;transform:scale(.4);stroke:#fff;stroke-width:2.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.btn-log.done .btn-label{opacity:0;transform:translateY(-14px)}
.btn-log.done .btn-check{opacity:1;transform:none;transition:all .4s var(--spring)}
.btn-log .btn-label{transition:all .3s var(--ease);display:flex;align-items:center;gap:8px}
.btn-log.done{background:var(--good);box-shadow:0 10px 26px -8px color-mix(in srgb,var(--good) 60%,transparent)}
.btn-log::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at var(--x,50%) var(--y,50%),rgba(255,255,255,.35),transparent 40%);opacity:0;transition:opacity .5s}
.btn-log.flash::before{opacity:1;transition:none}
.log-hint{text-align:center;font-size:12px;color:var(--text-3);margin-top:10px;display:none}
@media (hover:hover) and (pointer:fine){.log-hint{display:block}}

.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tool{display:flex;flex-direction:column;align-items:flex-start;gap:14px;padding:14px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-1);font-size:14px;font-weight:650;text-align:left;transition:transform .3s var(--ease),background .2s}
.tool:active{transform:scale(.95)}
@media (hover:hover){.tool:hover{background:var(--surface-2)}}
.tool .t-ico{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;color:#fff}
.tool small{display:block;font-size:12px;color:var(--text-2);font-weight:550;margin-top:2px}

/* today */
.today-top{display:flex;align-items:center;gap:18px}
.goal-ring{position:relative;width:92px;height:92px;flex-shrink:0}
.goal-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.goal-ring .ring-fg{stroke:var(--accent);stroke-width:9;filter:none}
.goal-ring .ring-bg{stroke-width:9}
.goal-ring.met .ring-fg{stroke:var(--good)}
.goal-ring .gr-text{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1}
.goal-ring b{font-size:24px;font-weight:800;letter-spacing:-.03em;display:block}
.goal-ring small{font-size:11px;color:var(--text-2);font-weight:650;margin-top:3px;display:block}
.today-stats{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:12px 10px}
.kv b{display:block;font-size:20px;font-weight:780;letter-spacing:-.025em;line-height:1.15}
.kv span{font-size:12px;color:var(--text-2);font-weight:600}
.today-list{margin-top:16px;border-top:1px solid var(--line);padding-top:6px}
.tl-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);animation:rise .5s var(--ease) both}
.tl-row:last-child{border-bottom:0}
.tl-main{flex:1;min-width:0}
.tl-name{font-weight:650;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-sets{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.tl-sets span{font-size:12px;font-weight:650;padding:3px 7px;border-radius:7px;background:var(--surface-2);color:var(--text-2)}
.tl-xp{font-weight:750;font-size:14px;color:var(--good);white-space:nowrap}
.empty{text-align:center;padding:26px 12px 12px;color:var(--text-2);font-size:14px}
.empty .ico{margin:0 auto 10px;width:34px;height:34px;color:var(--text-3);stroke-width:1.5}
.empty b{display:block;color:var(--text);font-size:16px;margin-bottom:4px}

/* tiles */
.tile{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex-shrink:0;color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent)}
.tile .ico{width:22px;height:22px}
.tile.sm{width:34px;height:34px;border-radius:10px}.tile.sm .ico{width:18px;height:18px}

/* ---------- Exercise list ---------- */
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow-1)}
.ex-row{display:flex;align-items:center;gap:12px;padding:10px 14px 10px 12px;min-height:62px;position:relative;cursor:pointer;transition:background .15s;outline:none;width:100%;text-align:left}
.ex-row+.ex-row::before,.li+.li::before,.h-row+.h-row::before{content:"";position:absolute;top:0;right:0;left:66px;height:1px;background:var(--line)}
.ex-row:active,.ex-row.kb{background:var(--surface-2)}
@media (hover:hover){.ex-row:hover{background:var(--surface-2)}}
.ex-main{flex:1;min-width:0}
.ex-name{font-weight:620;font-size:15.5px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ex-meta{font-size:13px;color:var(--text-2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mult{font-size:12.5px;font-weight:750;color:var(--text-2);background:var(--surface-2);padding:4px 8px;border-radius:8px;font-variant-numeric:tabular-nums;flex-shrink:0}
.fav-btn{width:36px;height:36px;display:grid;place-items:center;border-radius:50%;color:var(--text-3);flex-shrink:0;margin-right:-6px;transition:color .2s}
.fav-btn.on{color:var(--gold)}
.fav-btn.on .ico{fill:currentColor}
.fav-btn.popping .ico{animation:pop .45s var(--spring)}
.stagger>*{animation:rise .5s var(--ease) both;animation-delay:calc(min(var(--i,0),14)*22ms)}
.lib-tools{position:sticky;top:calc(var(--safe-t) + 52px);z-index:5;margin:0 -16px 12px;padding:8px 16px 10px;background:linear-gradient(var(--bg) 70%,transparent)}
.lib-tools .chips{margin-top:10px}
.lib-meta{display:flex;align-items:center;justify-content:space-between;margin:4px 6px 10px;font-size:13px;color:var(--text-2);font-weight:600}
.more-btn{display:block;margin:14px auto 0}

/* ---------- History ---------- */
.h-day{margin-bottom:22px;animation:rise .55s var(--ease) both;animation-delay:calc(min(var(--i,0),8)*40ms)}
.h-head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:0 6px 10px}
.h-date{font-size:17px;font-weight:720;letter-spacing:-.015em;text-transform:capitalize}
.h-sum{font-size:13px;color:var(--text-2);font-weight:550;margin-top:2px}
.h-xp{font-size:14px;font-weight:750;color:var(--good);white-space:nowrap}
.h-row{display:flex;align-items:center;gap:12px;padding:10px 14px 10px 12px;position:relative;cursor:pointer;transition:background .15s;width:100%;text-align:left}
@media (hover:hover){.h-row:hover{background:var(--surface-2)}}
.h-row:active{background:var(--surface-2)}
.h-main{flex:1;min-width:0}
.h-name{font-weight:620;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h-detail{font-size:13px;color:var(--text-2);margin-top:1px}
.h-earn{font-size:13.5px;font-weight:750;color:var(--text);white-space:nowrap}
.h-time{font-size:12px;color:var(--text-3);margin-top:1px;text-align:right}

/* ---------- Progress ---------- */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kpi{padding:16px 16px 14px;border-radius:var(--r-lg)}
.kpi .k-label{font-size:13px;color:var(--text-2);font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .k-label .ico{color:var(--kc,var(--accent))}
.kpi .k-val{font-size:28px;font-weight:800;letter-spacing:-.035em;margin-top:8px;line-height:1.1}
.kpi .k-sub{font-size:12.5px;color:var(--text-2);font-weight:550;margin-top:3px}
.delta{font-weight:700}.delta.up{color:var(--good)}.delta.down{color:var(--bad)}
.chart{position:relative;height:190px;margin:4px -4px 0;touch-action:pan-y}
.chart svg{width:100%;height:100%;overflow:visible}
.chart .grid line{stroke:var(--line);stroke-width:1}
.chart .area{fill:url(#gArea)}
.chart .line{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.6s var(--ease-io) .1s forwards}
.chart .area{opacity:0;animation:fade .9s var(--ease) .7s forwards}
.chart .cursor{opacity:0;transition:opacity .2s}
.chart.scrub .cursor{opacity:1}
.chart .cursor line{stroke:var(--text-3);stroke-width:1;stroke-dasharray:3 3}
.chart .cursor circle{fill:var(--surface);stroke:var(--accent);stroke-width:3}
.chart-tip{position:absolute;top:-6px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:6px 10px;border-radius:10px;font-size:12px;font-weight:700;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .2s;line-height:1.25;text-align:center}
.chart-tip small{display:block;font-weight:550;opacity:.7;font-size:11px}
.chart.scrub .chart-tip{opacity:1}
.chart-x{display:flex;justify-content:space-between;font-size:11px;color:var(--text-3);font-weight:600;margin-top:8px;padding:0 2px}
.bars{display:flex;align-items:flex-end;gap:6px;height:140px;margin-top:6px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;min-width:0}
.bars .b i{display:block;width:100%;max-width:28px;border-radius:7px 7px 4px 4px;background:var(--surface-3);transform-origin:bottom;animation:grow .9s var(--ease) both;animation-delay:calc(var(--i)*35ms);min-height:4px;position:relative}
.bars .b.has i{background:linear-gradient(180deg,var(--accent-2),var(--accent))}
.bars .b.today i{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--accent)}
.bars .b em{font-style:normal;font-size:10.5px;color:var(--text-3);font-weight:650;white-space:nowrap}
.bars .b i::after{content:attr(data-v);position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:10.5px;font-weight:750;color:var(--text-2);font-style:normal}
.bars .b i[data-v="0"]::after{content:""}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.heat::-webkit-scrollbar{display:none}
.heat i{width:100%;aspect-ratio:1;min-width:11px;border-radius:3.5px;background:var(--surface-3);animation:fade .4s var(--ease) both;animation-delay:calc(var(--i)*4ms)}
.heat i.l1{background:color-mix(in srgb,var(--accent) 30%,var(--surface-3))}
.heat i.l2{background:color-mix(in srgb,var(--accent) 55%,var(--surface-3))}
.heat i.l3{background:color-mix(in srgb,var(--accent) 80%,var(--surface-3))}
.heat i.l4{background:var(--accent)}
.heat i.t{outline:1.5px solid var(--text);outline-offset:1px}
.heat i.f{visibility:hidden}
.heat-legend{display:flex;align-items:center;justify-content:flex-end;gap:4px;margin-top:10px;font-size:11px;color:var(--text-3);font-weight:600}
.heat-legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.dist-row{display:grid;grid-template-columns:110px 1fr 54px;align-items:center;gap:12px;padding:7px 0;font-size:14px}
.dist-row .dn{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:8px}
.dist-row .dn::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c);flex-shrink:0}
.dist-row .dt{height:8px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.dist-row .dt i{display:block;height:100%;border-radius:inherit;background:var(--c);transform-origin:left;animation:growX 1s var(--ease) both;animation-delay:calc(var(--i)*45ms)}
@keyframes growX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.dist-row .dv{text-align:right;font-weight:700;color:var(--text-2);font-size:13px}

/* body map */
.body-wrap{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:4px 0 6px}
.body-view{text-align:center}
.body-view h4{margin:0 0 6px;font-size:12px;font-weight:650;color:var(--text-2);letter-spacing:.06em;text-transform:uppercase}
.body-svg{width:100%;max-width:190px;height:auto;margin:0 auto;overflow:visible}
.body-svg .outline{fill:none;stroke:var(--line-2);stroke-width:1.4;stroke-linejoin:round}
.body-svg .mz{fill:var(--surface-3);stroke:var(--bg);stroke-width:1.6;stroke-linejoin:round;cursor:pointer;transition:fill .6s var(--ease),opacity .25s,transform .3s var(--ease);transform-box:fill-box;transform-origin:center}
.body-svg .mz.has{filter:drop-shadow(0 0 5px color-mix(in srgb,var(--mc) 45%,transparent))}
@media (hover:hover){.body-svg .mz:hover{opacity:.85}}
.body-svg .mz.sel{stroke:var(--text);stroke-width:2}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;justify-content:center;margin:12px 0 4px;font-size:11.5px;color:var(--text-2);font-weight:600}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block}
.m-row{display:flex;align-items:center;gap:12px;padding:11px 14px 11px 12px;position:relative;cursor:pointer;width:100%;text-align:left;transition:background .15s}
.m-row+.m-row::before{content:"";position:absolute;top:0;right:0;left:62px;height:1px;background:var(--line)}
@media (hover:hover){.m-row:hover{background:var(--surface-2)}}
.m-emb{width:38px;height:38px;flex-shrink:0;display:grid;place-items:center}
.m-emb svg{width:34px;height:34px}
.m-emb.none{border-radius:11px;background:var(--surface-2);color:var(--text-3)}
.m-main{flex:1;min-width:0}
.m-top{display:flex;justify-content:space-between;gap:8px;font-size:15px;font-weight:620}
.m-top span:last-child{font-size:13px;font-weight:700;white-space:nowrap}
.m-bar{height:5px;border-radius:99px;background:var(--surface-3);overflow:hidden;margin-top:7px}
.m-bar i{display:block;height:100%;border-radius:inherit;background:var(--mc);transform-origin:left;animation:growX 1s var(--ease) both;animation-delay:calc(var(--i)*40ms)}
.m-sub{font-size:12px;color:var(--text-2);margin-top:5px;font-weight:550}

.pr-row,.top-row{display:flex;align-items:center;gap:12px;padding:11px 14px 11px 12px;position:relative;cursor:pointer;width:100%;text-align:left}
.pr-row+.pr-row::before,.top-row+.top-row::before{content:"";position:absolute;top:0;right:0;left:66px;height:1px;background:var(--line)}
@media (hover:hover){.pr-row:hover,.top-row:hover{background:var(--surface-2)}}
.pr-val{text-align:right;white-space:nowrap}
.pr-val b{display:block;font-size:15px;font-weight:750;color:var(--gold)}
.pr-val small{font-size:12px;color:var(--text-2);font-weight:600}
.top-rank{width:26px;text-align:center;font-weight:800;color:var(--text-3);font-size:15px;flex-shrink:0}
.top-row:nth-child(1) .top-rank{color:var(--gold)}
.top-bar{height:4px;border-radius:99px;background:var(--surface-3);margin-top:6px;overflow:hidden}
.top-bar i{display:block;height:100%;background:var(--accent);border-radius:inherit;transform-origin:left;animation:growX 1s var(--ease) both;animation-delay:calc(var(--i)*45ms)}

/* ---------- Settings ---------- */
.li{display:flex;align-items:center;gap:13px;min-height:54px;padding:10px 16px 10px 14px;position:relative;width:100%;text-align:left}
.li+.li::before{left:58px}
button.li{transition:background .15s}
button.li:active{background:var(--surface-2)}
@media (hover:hover){button.li:hover{background:var(--surface-2)}}
.li-ico{width:30px;height:30px;border-radius:8.5px;display:grid;place-items:center;color:#fff;flex-shrink:0;background:var(--c,#8e8e93)}
.li-ico .ico{width:18px;height:18px;stroke-width:2}
.li-main{flex:1;min-width:0}
.li-title{font-size:16px;font-weight:550;letter-spacing:-.01em}
.li-sub{font-size:13px;color:var(--text-2);margin-top:1px}
.li-val{color:var(--text-2);font-size:15px;display:flex;align-items:center;gap:4px;white-space:nowrap}
.li-chev{color:var(--text-3)}
.li.stacked{flex-wrap:wrap}
.li.stacked .seg{flex-basis:100%;margin:6px 0 4px 43px}
.li.danger .li-title{color:var(--bad)}
.set-note{font-size:13px;color:var(--text-2);margin:8px 16px 0;line-height:1.45}
.detect{display:flex;flex-wrap:wrap;gap:6px;margin:10px 4px 0}
.about{text-align:center;color:var(--text-3);font-size:13px;margin:28px 0 8px;line-height:1.6}
.about svg{width:44px;height:44px;margin:0 auto 10px}
.about a{color:var(--text-2)}

/* ---------- Tab bar / Sidebar ---------- */
.tabbar{position:fixed;z-index:50;left:50%;bottom:calc(10px + var(--safe-b));transform:translateX(-50%);width:min(calc(100% - 24px),460px);height:var(--tab-h);border-radius:32px;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);border:1px solid var(--glass-line);box-shadow:0 12px 40px rgba(0,0,0,.28),0 1px 0 rgba(255,255,255,.05) inset;padding:5px;transition:transform .45s var(--ease),opacity .3s}
.tabbar.hide{transform:translate(-50%,140%);opacity:0}
.tabbar .brand,.tabbar .side-foot{display:none}
.tabs{position:relative;display:grid;grid-template-columns:repeat(5,1fr);height:100%}
.tab{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:26px;color:var(--text-2);font-size:10.5px;font-weight:650;letter-spacing:.01em;transition:color .3s,transform .3s var(--ease)}
.tab:active{transform:scale(.9)}
.tab .ico{width:23px;height:23px;transition:transform .45s var(--spring)}
.tab.on{color:var(--accent)}
.tab.on .ico{transform:translateY(-1px)}
.tab-ind{position:absolute;z-index:0;top:0;left:0;height:100%;border-radius:26px;background:color-mix(in srgb,var(--text) 8%,transparent);transition:transform .5s var(--ease),width .5s var(--ease),height .5s var(--ease)}
.tab span{white-space:nowrap}

/* ---------- Timer pill ---------- */
.timer-pill{position:fixed;z-index:45;left:50%;bottom:calc(var(--tab-h) + 22px + var(--safe-b));transform:translate(-50%,24px) scale(.9);opacity:0;pointer-events:none;display:flex;align-items:center;gap:12px;padding:7px 7px 7px 8px;border-radius:99px;background:#0c0c0e;color:#fff;box-shadow:0 18px 50px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.08) inset;transition:transform .55s var(--spring),opacity .3s}
.timer-pill.show{transform:translate(-50%,0) scale(1);opacity:1;pointer-events:auto}
.timer-pill.done{animation:shake .5s var(--ease)}
@keyframes shake{20%,60%{transform:translate(calc(-50% - 4px),0)}40%,80%{transform:translate(calc(-50% + 4px),0)}}
.tp-ring{width:40px;height:40px;position:relative}
.tp-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.tp-ring circle{fill:none;stroke-width:4}
.tp-ring .bg{stroke:rgba(255,255,255,.14)}
.tp-ring .fg{stroke:var(--accent);stroke-linecap:round;stroke-dasharray:100;transition:stroke-dashoffset .3s linear}
.tp-ring .ico{position:absolute;inset:0;margin:auto;width:16px;height:16px;color:var(--accent)}
.tp-time{font-size:22px;font-weight:750;letter-spacing:-.02em;font-variant-numeric:tabular-nums;min-width:62px}
.tp-label{font-size:11px;color:rgba(255,255,255,.55);font-weight:650;display:block;line-height:1;margin-bottom:2px;letter-spacing:.04em;text-transform:uppercase}
.tp-btn{height:40px;min-width:40px;padding:0 12px;border-radius:99px;background:rgba(255,255,255,.12);color:#fff;font-weight:700;font-size:14px;display:grid;place-items:center;transition:transform .2s var(--ease),background .2s}
.tp-btn:active{transform:scale(.9);background:rgba(255,255,255,.2)}

/* ---------- Toasts ---------- */
.toasts{position:fixed;z-index:200;top:calc(var(--safe-t) + 10px);left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 12px}
.toast{pointer-events:auto;display:flex;align-items:center;gap:10px;min-height:48px;max-width:min(440px,100%);padding:8px 10px 8px 14px;border-radius:24px;background:#0c0c0e;color:#fff;font-size:14.5px;font-weight:600;box-shadow:0 16px 48px rgba(0,0,0,.4),0 0 0 1px rgba(255,255,255,.08) inset;transform:translateY(-130%) scale(.85);opacity:0;transition:transform .6s var(--spring),opacity .35s var(--ease)}
.toast.show{transform:none;opacity:1}
.toast.hide{transform:translateY(-60%) scale(.9);opacity:0;transition:transform .35s var(--ease),opacity .25s}
.toast .t-ic{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;background:rgba(255,255,255,.12)}
.toast .t-ic .ico{width:16px;height:16px;stroke-width:2.4}
.toast.good .t-ic{background:var(--good);color:#fff}
.toast.bad .t-ic{background:var(--bad);color:#fff}
.toast.pr .t-ic{background:#ffc83d;color:#3a2600}
.toast.rank .t-ic{background:var(--accent);color:#fff}
.toast.info .t-ic{background:rgba(255,255,255,.16)}
.toast .t-msg{flex:1;min-width:0;padding-right:6px;line-height:1.3}
.toast .t-msg small{display:block;font-size:12px;color:rgba(255,255,255,.6);font-weight:550}
.toast .t-act{height:32px;padding:0 13px;border-radius:99px;background:rgba(255,255,255,.14);color:#fff;font-size:13px;font-weight:700;flex-shrink:0}

/* ---------- Sheet ---------- */
.sheet-backdrop{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.42);opacity:0;pointer-events:none;transition:opacity .4s var(--ease)}
.sheet-backdrop.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:101;left:0;right:0;bottom:0;max-height:calc(100dvh - var(--safe-t) - 24px);display:flex;flex-direction:column;background:var(--surface);border-radius:28px 28px 0 0;box-shadow:var(--shadow-2);transform:translateY(105%);transition:transform .5s var(--ease);padding-bottom:var(--safe-b);visibility:hidden;outline:none}
.sheet.show{transform:none;visibility:visible}
.sheet.tall{height:calc(100dvh - var(--safe-t) - 24px)}
.sheet.dragging{transition:none}
.sheet-grab{flex-shrink:0;padding:8px 20px 6px;cursor:grab;touch-action:none}
.grabber{display:block;width:38px;height:5px;border-radius:99px;background:var(--surface-4);margin:0 auto 10px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:36px}
.sheet-head h3{margin:0;font-size:20px;font-weight:750;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-body{overflow-y:auto;padding:10px 20px 24px;overscroll-behavior:contain;flex:1;-webkit-overflow-scrolling:touch}
.sheet-body>*{animation:rise .5s var(--ease) both;animation-delay:calc(var(--i,0)*45ms + 80ms)}
.sheet-actions{display:flex;gap:10px;margin-top:18px}
.sheet-actions .btn{flex:1}
.sheet-text{color:var(--text-2);font-size:15px;line-height:1.5;margin:0 0 6px}
body.sheet-open .main{transform:scale(.94) translateY(8px);filter:brightness(.75);border-radius:28px;overflow:hidden}
:root[data-theme=light] body.sheet-open .main{filter:brightness(.92)}
.picker-sheet .search{position:sticky;top:0;z-index:2}
.picker-sheet .chips{margin:10px 0 6px}
.picker-sheet .list{box-shadow:none;margin-top:6px}
.ps-label{font-size:12px;font-weight:650;color:var(--text-2);letter-spacing:.06em;text-transform:uppercase;margin:16px 4px 8px}

/* detail sheet */
.ex-hero{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.ex-hero .tile{width:56px;height:56px;border-radius:16px}.ex-hero .tile .ico{width:28px;height:28px}
.ex-hero h4{margin:0;font-size:22px;font-weight:780;letter-spacing:-.025em;line-height:1.15}
.ex-hero p{margin:3px 0 0;color:var(--text-2);font-size:14px}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat-box{background:var(--surface-2);border-radius:var(--r-md);padding:12px}
.stat-box b{display:block;font-size:18px;font-weight:780;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat-box span{font-size:12px;color:var(--text-2);font-weight:600}
.spark{height:90px;margin-top:6px}
.spark svg{width:100%;height:100%;overflow:visible}
.spark path.l{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.2s var(--ease-io) .2s forwards}
.spark circle{fill:var(--accent)}
.sess{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.sess:last-child{border:0}
.sess span:first-child{color:var(--text-2);text-transform:capitalize;white-space:nowrap}
.sess span:last-child{font-weight:600;text-align:right}

/* ladder */
.ladder{position:relative}
.lad{display:flex;align-items:center;gap:14px;padding:9px 10px;border-radius:var(--r-md);position:relative;transition:background .2s}
.lad svg{width:40px;height:40px;flex-shrink:0}
.lad .lad-main{flex:1;min-width:0}
.lad .lad-name{font-weight:700;font-size:15.5px}
.lad .lad-xp{font-size:13px;color:var(--text-2);font-variant-numeric:tabular-nums}
.lad.locked{opacity:.42}
.lad.locked svg{filter:grayscale(.9)}
.lad.cur{background:color-mix(in srgb,var(--tier) 13%,transparent);box-shadow:0 0 0 1.5px color-mix(in srgb,var(--tier) 60%,transparent) inset}
.lad.cur .lad-name{color:var(--tier)}
.lad-tier{font-size:12px;font-weight:650;color:var(--text-3);letter-spacing:.06em;text-transform:uppercase;margin:16px 10px 4px}

/* plates */
.plate-viz{height:150px;display:flex;align-items:center;justify-content:center;margin:8px 0 10px;position:relative;overflow:hidden}
.plate-viz .barl{position:absolute;left:4%;right:4%;height:12px;border-radius:4px;background:linear-gradient(180deg,#d8dbe0,#8c9199);top:50%;transform:translateY(-50%)}
.plate-viz .sleeve{display:flex;align-items:center;gap:3px;position:relative;z-index:1}
.plate-viz .collar{width:14px;height:34px;border-radius:4px;background:linear-gradient(90deg,#9aa0a8,#e1e4e8,#9aa0a8);position:relative;z-index:2}
.plate{width:var(--w);height:var(--h);border-radius:5px;background:var(--pc);box-shadow:inset -3px 0 0 rgba(0,0,0,.18),inset 2px 0 0 rgba(255,255,255,.2);animation:plateIn .5s var(--spring) both;animation-delay:calc(var(--i)*60ms)}
@keyframes plateIn{from{opacity:0;transform:translateX(var(--dx,-30px)) scale(.6)}to{opacity:1;transform:none}}
.plate-list{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.plate-list span{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:5px 10px;border-radius:99px;background:var(--surface-2)}
.plate-list i{width:10px;height:10px;border-radius:3px;background:var(--pc)}
.big-num{font-size:44px;font-weight:800;letter-spacing:-.04em;text-align:center;line-height:1.1;margin:6px 0 2px}
.big-sub{text-align:center;color:var(--text-2);font-size:14px;font-weight:550}
.pct-table{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.pct-table div{background:var(--surface-2);border-radius:12px;padding:10px;text-align:center}
.pct-table b{display:block;font-size:16px;font-weight:750}
.pct-table span{font-size:12px;color:var(--text-2);font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* ---------- Celebration ---------- */
.celebrate{position:fixed;inset:0;overflow:hidden;z-index:300;display:grid;place-items:center;background:rgba(0,0,0,.72);-webkit-backdrop-filter:blur(18px) saturate(140%);backdrop-filter:blur(18px) saturate(140%);opacity:0;pointer-events:none;transition:opacity .5s var(--ease);color:#fff;text-align:center;padding:24px}
.celebrate.show{opacity:1;pointer-events:auto}
.celebrate canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.cel-inner{position:relative;display:flex;flex-direction:column;align-items:center}
.cel-emb{position:relative;width:190px;height:190px;display:grid;place-items:center;margin-bottom:20px}
.cel-rays{position:absolute;inset:-70px;border-radius:50%;background:repeating-conic-gradient(from 0deg,color-mix(in srgb,var(--tier) 40%,transparent) 0 6deg,transparent 6deg 18deg);-webkit-mask-image:radial-gradient(circle,#000 18%,transparent 68%);mask-image:radial-gradient(circle,#000 18%,transparent 68%);animation:spin 18s linear infinite;opacity:0;transition:opacity 1s .3s}
.celebrate.show .cel-rays{opacity:1}
@keyframes spin{to{transform:rotate(360deg)}}
.cel-emb .emb-wrap{width:150px;height:150px;transform:scale(.2) rotate(-25deg);opacity:0;filter:drop-shadow(0 18px 40px color-mix(in srgb,var(--tier) 60%,transparent))}
.celebrate.show .cel-emb .emb-wrap{animation:embIn 1.1s var(--spring) .15s forwards}
@keyframes embIn{0%{transform:scale(.2) rotate(-25deg);opacity:0}60%{opacity:1}100%{transform:none;opacity:1}}
.cel-eyebrow{font-size:13px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:rgba(255,255,255,.65);opacity:0;transform:translateY(10px)}
.cel-name{font-size:48px;font-weight:850;letter-spacing:-.04em;line-height:1.05;margin:8px 0 10px;color:var(--tier);opacity:0;transform:translateY(14px)}
.cel-sub{font-size:16px;color:rgba(255,255,255,.7);max-width:300px;opacity:0;transform:translateY(10px)}
.celebrate .btn{margin-top:28px;background:#fff;color:#000;min-width:180px;opacity:0;transform:translateY(10px)}
.celebrate.show .cel-eyebrow{animation:up .6s var(--ease) .55s forwards}
.celebrate.show .cel-name{animation:up .7s var(--ease) .68s forwards}
.celebrate.show .cel-sub{animation:up .6s var(--ease) .85s forwards}
.celebrate.show .btn{animation:up .6s var(--ease) 1s forwards}
@keyframes up{to{opacity:1;transform:none}}

/* View transitions (theme switch) */
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
::view-transition-new(root){z-index:2}

/* ---------- Desktop ---------- */
@media (min-width:720px){
  .sheet{left:50%;right:auto;bottom:auto;top:50%;width:540px;max-height:min(760px,calc(100dvh - 64px));border-radius:28px;transform:translate(-50%,-46%) scale(.96);opacity:0;transition:transform .45s var(--ease),opacity .3s var(--ease),visibility .45s;padding-bottom:0}
  .sheet.show{transform:translate(-50%,-50%);opacity:1}
  .sheet.tall{height:min(760px,calc(100dvh - 64px))}
  .grabber{display:none}
  .sheet-grab{padding:18px 22px 6px;cursor:default}
  .sheet-body{padding:10px 22px 24px}
  body.sheet-open .main{transform:none;filter:none;border-radius:0;overflow:visible}
  .kpis{grid-template-columns:repeat(4,1fr)}
}
@media (min-width:960px){
  .main{max-width:none;margin-left:var(--side-w);padding:44px 48px 72px}
  .page{max-width:1100px;margin:0 auto}
  .navbar{display:none}
  .tabbar{left:0;top:0;bottom:0;transform:none;width:var(--side-w);height:auto;border-radius:0;border:0;border-right:1px solid var(--line);background:var(--bg-2);box-shadow:none;padding:28px 16px 20px;display:flex;flex-direction:column;-webkit-backdrop-filter:none;backdrop-filter:none}
  .tabbar .brand{display:flex;align-items:center;gap:11px;padding:0 10px 28px;font-weight:800;font-size:18px;letter-spacing:-.02em}
  .tabbar .brand svg{width:34px;height:34px}
  .tabbar .brand small{display:block;font-size:11px;font-weight:650;color:var(--text-3);letter-spacing:.08em;text-transform:uppercase}
  .tabs{display:flex;flex-direction:column;height:auto;gap:2px}
  .tab{flex-direction:row;justify-content:flex-start;gap:12px;height:44px;padding:0 12px;font-size:15px;font-weight:600;border-radius:12px;color:var(--text-2)}
  .tab:active{transform:scale(.97)}
  .tab.on{color:var(--text)}
  .tab.on .ico{color:var(--accent);transform:none}
  .tab-ind{border-radius:12px;background:var(--surface-2)}
  .tabbar .side-foot{display:block;margin-top:auto;padding:0 12px;font-size:12px;color:var(--text-3);line-height:1.6}
  .tabbar .side-foot kbd{font:600 11px/1 var(--font);border:1px solid var(--line-2);border-radius:5px;padding:2px 5px;margin-right:4px}
  .timer-pill{left:calc(50% + var(--side-w)/2);bottom:28px}
  .col{display:flex;flex-direction:column;gap:16px;min-width:0}
  .grid-train{display:grid;grid-template-columns:1.05fr 1fr;gap:16px;align-items:start}
  .ph-title{font-size:40px}
  .lib-tools{top:0;margin:0 0 12px;padding:8px 0 10px}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
  .grid-2>.span{grid-column:1/-1}
  .settings-wrap{max-width:760px}
  .lib-list{column-count:1}
}
@media (max-width:959px){
  .grid-train{display:flex;flex-direction:column;gap:14px}
  .o1{order:1}.o2{order:2}.o3{order:3}.o4{order:4}
  .grid-2{display:flex;flex-direction:column;gap:14px}
}
@media (max-width:380px){
  .hero-emblem{width:92px;height:92px}#heroEmblem{width:60px;height:60px}
  .hero-rank{font-size:26px}
  .ph-title{font-size:30px}
  .stepper input{font-size:24px}
  .tools .tool{padding:12px}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
  .chart .line,.spark path.l,.splash-logo .lg-shield{stroke-dashoffset:0}
}

let totalXp=0,lastWorkoutTime=Date.now(),lastDecayTime=Date.now(),currentRankIndex=0;
function migrateData(){
  if(LS.get('gr_migrated'))return;
  const oldXp=LS.get('hc_gymXp');
  if(oldXp!==null){LS.set('gr_xp',oldXp);LS.set('gr_lastWorkout',LS.get('hc_lastWorkout',Date.now()));LS.set('gr_lastDecay',LS.get('hc_lastDecay',Date.now()))}
  LS.set('gr_migrated','true');
}
function loadState(){totalXp=parseFloat(LS.get('gr_xp','0'))||0;lastWorkoutTime=parseInt(LS.get('gr_lastWorkout',Date.now()),10)||Date.now();lastDecayTime=parseInt(LS.get('gr_lastDecay',Date.now()),10)||Date.now()}
function saveState(){LS.set('gr_xp',totalXp);LS.set('gr_lastWorkout',lastWorkoutTime);LS.set('gr_lastDecay',lastDecayTime)}
function applyDecay(){
  if(totalXp<=0)return 0;
  const now=Date.now(),penaltyStart=lastWorkoutTime+GRACE_DAYS*MS_DAY;
  if(now<=penaltyStart)return 0;
  const from=Math.max(penaltyStart,lastDecayTime),days=Math.floor((now-from)/MS_DAY);
  if(days<=0)return 0;
  const old=totalXp;for(let i=0;i<days;i++)totalXp*=(1-DECAY_RATE);
  lastDecayTime=from+days*MS_DAY;saveState();return old-totalXp;
}

  const s=getStreak(),today=dayKey(),yest=dayKey(addDays(Date.now(),-1));
  if(s.lastDay===today)return s;
  s.current=s.lastDay===yest?s.current+1:1;s.lastDay=today;s.longest=Math.max(s.longest||0,s.current);s.bonusXpToday=false;

}

const MUSCLE_LIST=['chest','back','shoulders','biceps','triceps','quads','hamstrings','glutes','calves','core','forearms','traps','fullBody'];

const exName=ex=>ex?(ex.custom?ex.name:(LANG==='de'?ex.nameDe:ex.nameEn)):'?';
const exAlt=ex=>ex.custom?'':(LANG==='de'?ex.nameEn:ex.nameDe);
const exMeta=ex=>t(ex.muscle)+' · '+t(ex.equipment);
const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/ß/g,'ss').replace(/ı/g,'i');
function searchEx(q,f={}){
  let list=allEx();
  if(f.muscle&&f.muscle!=='all')list=list.filter(e=>e.muscle===f.muscle);
  if(f.equip&&f.equip!=='all')list=list.filter(e=>e.equipment===f.equip);
  if(f.fav){const fv=new Set(getFavs());list=list.filter(e=>fv.has(e.id))}
  const nq=norm(q||'').trim();
  if(!nq)return list.slice().sort((a,b)=>exName(a).localeCompare(exName(b),locale()));
  const toks=nq.split(/\s+/);
  return list.map(e=>{
    const n=norm(exName(e)),o=norm(exAlt(e)),m=norm(t(e.muscle)+' '+t(e.equipment));let s=0;
    if(n.startsWith(nq))s=100;else if(o.startsWith(nq))s=90;
    else if(n.split(/[\s\-()/]+/).some(w=>w.startsWith(nq)))s=75;
    else if(n.includes(nq)||o.includes(nq))s=55;
    else if(toks.every(k=>n.includes(k)||o.includes(k)||m.includes(k)))s=30;
    return{e,s};
  }).filter(x=>x.s>0).sort((a,b)=>b.s-a.s).map(x=>x.e);
}

function muscleRanks(){
  const prs=getPRs(),best={},src={};
  Object.entries(prs).forEach(([id,pr])=>{const ex=getEx(id);if(!ex)return;[ex.muscle].concat(secondaryMuscles[id]||[]).forEach(m=>{if(!best[m]||pr.oneRM>best[m]){best[m]=pr.oneRM;src[m]=id}})});
  const out={};
  MUSCLE_LIST.forEach(m=>{
    const rm=best[m]||0,th=muscleThresholds[m];let ri=-1;
    if(rm>0)for(let i=th.length-1;i>=0;i--){if(rm>=th[i]){ri=i;break}}
    const next=ri<th.length-1?th[ri+1]:null,cur=ri>=0?th[ri]:0;

  });

}

/* ---------- Tween ---------- */
function tween(el,to,fmt=fmtN,dur=1100){
  if(!el)return;const from=el._v==null?0:el._v;el._v=to;cancelAnimationFrame(el._raf);
  if(reduceMotion()||Math.abs(from-to)<1){el.textContent=fmt(to);return}
  const t0=performance.now();
  const f=now=>{const p=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-p,4);el.textContent=fmt(from+(to-from)*e);if(p<1)el._raf=requestAnimationFrame(f)};
  el._raf=requestAnimationFrame(f);
}

function toast(msg,o={}){

  el.className='toast '+type;

  el.innerHTML=`<span class="t-ic">${ico(ic)}</span><span class="t-msg">${esc(msg)}${o.sub?`<small>${esc(o.sub)}</small>`:''}</span>${o.action?`<button class="t-act">${esc(o.action.label)}</button>`:''}`;
  let timer;
  const kill=()=>{clearTimeout(timer);if(el._dead)return;el._dead=1;el.classList.add('hide');setTimeout(()=>el.remove(),400)};
  if(o.action)el.querySelector('.t-act').addEventListener('click',e=>{e.stopPropagation();o.action.fn();kill()});
  el.addEventListener('click',kill);
  box.prepend(el);
  while(box.children.length>3){const last=box.lastElementChild;last.remove()}
  requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add('show')));
  timer=setTimeout(kill,o.dur||3200);
  return kill;
}

function openExDetail(id){

  const series=days.slice(-16).map(k=>Math.max(...byDay[k].map(e=>oneRM(e.weight,e.reps))));

    ${spark}

function smoothPath(pts){
  if(pts.length<2)return '';let d=`M${pts[0][0]},${pts[0][1]}`;
  for(let i=0;i<pts.length-1;i++){const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2,k=.18;
    const c1x=p1[0]+(p2[0]-p0[0])*k,c1y=p1[1]+(p2[1]-p0[1])*k,c2x=p2[0]-(p3[0]-p1[0])*k,c2y=p2[1]-(p3[1]-p1[1])*k;
    const lo=Math.max(p1[1],p2[1]),hi=Math.min(p1[1],p2[1]);
    d+=` C${c1x.toFixed(1)},${clamp(c1y,hi,lo).toFixed(1)} ${c2x.toFixed(1)},${clamp(c2y,hi,lo).toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`}
  return d;
}
function dailySeries(h,n,fn){const now=Date.now(),keys=[],map={};for(let i=n-1;i>=0;i--){const k=dayKey(addDays(now,-i));keys.push(k);map[k]=0}h.forEach(e=>{const k=dayKey(e.ts);if(k in map)map[k]+=fn(e)});return keys.map(k=>({k,v:map[k]}))}
function overviewView(h){
  const days=new Set(h.map(e=>dayKey(e.ts))),st=getStreak(),ls=liveStreak();
  const now=Date.now(),wk=h.filter(e=>e.ts>startOfDay(addDays(now,-6))).length,pwk=h.filter(e=>e.ts>startOfDay(addDays(now,-13))&&e.ts<=startOfDay(addDays(now,-6))).length;

  const kpis=`<div class="kpis span">${kpi('bolt','var(--accent)',t('totalXp'),fmtN(totalXp),esc(rankName(rankOf(totalXp))))}${kpi('flame','#ff9f0a',t('streak'),ls+' <small style="font-size:15px;color:var(--text-2)">'+esc(t('daysShort'))+'</small>',esc(t('bestStreak',{n:st.longest||0})))}${kpi('history','#0a84ff',t('trainingDays'),fmtN(days.size),esc(t('avgSets',{n:days.size?NF1.format(h.length/days.size):0})))}${kpi('chart','#30d158',t('last7'),fmtN(wk)+' <small style="font-size:15px;color:var(--text-2)">'+esc(t('sets'))+'</small>',delta===null?esc(t('vsPrev')):`<span class="delta ${delta>=0?'up':'down'}">${delta>=0?'+':''}${delta}%</span> ${esc(t('vsPrev'))}`)}</div>`;
  const xp30=dailySeries(h,30,entryXp),sum30=xp30.reduce((s,x)=>s+x.v,0);

  const s14=dailySeries(h,14,()=>1),mx=Math.max(1,...s14.map(x=>x.v)),tk=dayKey();
  const bars=`<div class="card"><div class="card-head"><h3 class="card-title">${esc(t('sets14'))}</h3><span class="card-sub num">${fmtN(s14.reduce((s,x)=>s+x.v,0))}</span></div><div class="bars">${s14.map((x,i)=>`<div class="b${x.v?' has':''}${x.k===tk?' today':''}"><i data-v="${x.v}" style="height:${Math.max(3,x.v/mx*100)}%;--i:${i}"></i><em>${esc(fmtDate(keyToDate(x.k),{weekday:'narrow'}))}</em></div>`).join('')}</div></div>`;
  // heatmap 20 weeks, Monday-first
  const W=20,today=startOfDay(),dow=(new Date(today).getDay()+6)%7,start=addDays(today,-(W-1)*7-dow),cnt={};
  h.forEach(e=>{const k=dayKey(e.ts);cnt[k]=(cnt[k]||0)+1});
  let cells='';for(let i=0;i<W*7;i++){const ts=addDays(start,i),k=dayKey(ts),c=cnt[k]||0,lv=c===0?'':c<6?'l1':c<12?'l2':c<20?'l3':'l4';cells+=`<i class="${lv}${k===tk?' t':''}${ts>today?' f':''}" style="--i:${i}" title="${esc(fmtDate(ts,{day:'numeric',month:'short'}))}: ${c}"></i>`}

  const dist={};h.forEach(e=>{const ex=getEx(e.exId);if(ex)dist[ex.muscle]=(dist[ex.muscle]||0)+e.xp});
  const tot=Object.values(dist).reduce((a,b)=>a+b,0),dm=Math.max(1,...Object.values(dist));

  const distCard=`<div class="card span"><div class="card-head"><h3 class="card-title">${esc(t('muscleDist'))}</h3><span class="card-sub">${esc(t('byXp'))}</span></div>${rows||`<div class="empty">${ico('chart')}<b>${esc(t('noData'))}</b>${esc(t('noDataSub'))}</div>`}</div>`;
  return `<div class="grid-2">${kpis}${xpCard}${bars}${heat}${distCard}</div>`;
}
function mountXpChart(h){
  const box=$('#xpChart');if(!box)return;

const b64e=s=>btoa(unescape(encodeURIComponent(s)));
const b64d=s=>decodeURIComponent(escape(atob(String(s).replace(/\s+/g,''))));
function backupData(){return{v:3,xp:totalXp,lw:lastWorkoutTime,ld:lastDecayTime,h:getHistory(),pr:getPRs(),fav:getFavs(),str:getStreak(),rec:getRecent(),custom:CUSTOM,lang:pref.lang,theme:pref.theme,timer:pref.timer,autoTimer:pref.autoTimer,vib:pref.vib,sound:pref.sound,wUnit:pref.unit,goal:pref.goal}}
function importData(d){
  if(!d||typeof d!=='object'||d.xp===undefined||d.lw===undefined)throw new Error('bad');
  totalXp=parseFloat(d.xp)||0;lastWorkoutTime=parseInt(d.lw,10)||Date.now();lastDecayTime=parseInt(d.ld||d.lw,10)||Date.now();saveState();
  if(d.v>=2){
    if(Array.isArray(d.h))saveHistory(d.h);if(d.pr)savePRs(d.pr);if(Array.isArray(d.fav))saveFavs(d.fav);if(d.str)saveStreak(d.str);
    if(Array.isArray(d.rec))LS.setJson('gr_recent',d.rec);if(Array.isArray(d.custom)){CUSTOM=d.custom;saveCustom()}
    if(d.lang)setPref('lang',d.lang);if(d.theme)setPref('theme',d.theme);if(d.timer)setPref('timer',parseInt(d.timer,10)||90);
    if(d.autoTimer!==undefined)setPref('autoTimer',!!d.autoTimer);if(d.vib!==undefined)setPref('vib',!!d.vib);if(d.sound!==undefined)setPref('sound',!!d.sound);
    if(d.wUnit)setPref('unit',d.wUnit);if(d.goal!==undefined)setPref('goal',parseInt(d.goal,10)||0);
  }

}

const TMR={end:0,total:0,iv:null};
function startTimer(sec){sec=sec||pref.timer;TMR.total=sec;TMR.end=Date.now()+sec*1000;LS.set('gr_tEnd',TMR.end);LS.set('gr_tTot',sec);runTimer()}
function runTimer(){clearInterval(TMR.iv);$('#timerPill').classList.add('show');tickTimer();TMR.iv=setInterval(tickTimer,250)}
function tickTimer(){
  const left=Math.max(0,TMR.end-Date.now()),s=Math.ceil(left/1000);
  $('#tpTime').textContent=fmtClock(s);$('#tpFg').style.strokeDashoffset=String(100-(left/(TMR.total*1000))*100);
  if(left<=0)finishTimer();
}
function finishTimer(){const p=$('#timerPill');stopTimer();haptic([200,100,200]);SFX.timer();toast(t('restDone'),{type:'good',icon:'timer',sub:t('restDoneSub')});p.classList.add('done');setTimeout(()=>p.classList.remove('done'),600)}
function stopTimer(){clearInterval(TMR.iv);TMR.end=0;LS.del('gr_tEnd');$('#timerPill').classList.remove('show')}
function openTimerSheet(){
  const opts=[30,45,60,90,120,150,180,240,300];
  const b=openSheet({title:t('toolTimer'),body:`<p class="sheet-text">${esc(t('timerPick'))}</p><div class="pct-table">${opts.map(s=>`<button class="btn btn-secondary" data-s="${s}" style="height:58px;font-size:18px;font-weight:750${s===pref.timer?';box-shadow:0 0 0 2px var(--accent) inset':''}">${fmtClock(s)}</button>`).join('')}</div>${TMR.end?`<div class="sheet-actions"><button class="btn btn-danger" data-stop="1">${esc(t('stopTimer'))}</button></div>`:''}`});
  b.onclick=e=>{if(e.target.closest('[data-stop]')){stopTimer();closeSheet();return}const x=e.target.closest('[data-s]');if(!x)return;startTimer(parseInt(x.dataset.s,10));closeSheet()};
}
const PLATES={kg:{bars:[20,15,10],plates:[25,20,15,10,5,2.5,1.25],col:{25:'#e5302a',20:'#1f6fe5',15:'#f2c218',10:'#2fa84f',5:'#f2f2f2','2.5':'#2b2b2b','1.25':'#b9bec6'}},lbs:{bars:[45,35,15],plates:[45,35,25,10,5,2.5],col:{45:'#1f6fe5',35:'#f2c218',25:'#2fa84f',10:'#f2f2f2',5:'#e5302a','2.5':'#2b2b2b'}}};
function openPlates(){
  const u=UNIT(),P=PLATES[u],cur=parseNum($('#inWeight').value);let bar=P.bars[0];
  const b=openSheet({title:t('toolPlates'),body:`<div class="form-row"><label class="label" for="plT">${esc(t('targetWeight'))} (${u})</label><input class="input num" id="plT" inputmode="decimal" value="${cur>0?fmtInput(cur):(u==='kg'?100:225)}" style="font-size:22px;font-weight:750;height:56px"></div><div class="form-row"><label class="label">${esc(t('barWeight'))}</label><div class="seg" id="plBar">${P.bars.map(x=>`<button data-v="${x}">${fmtInput(x)} ${u}</button>`).join('')}</div></div><div class="plate-viz" id="plViz"></div><div class="big-sub" id="plSum"></div><div class="plate-list" id="plList" style="margin-top:12px"></div>`});
  const calc=()=>{
    const target=parseNum($('#plT',b).value)||0;let side=(target-bar)/2;const used=[];
    if(side>0)P.plates.forEach(p=>{while(side>=p-1e-9){used.push(p);side=Math.round((side-p)*1000)/1000}});
    const loaded=bar+used.reduce((a,x)=>a+x,0)*2,mxp=P.plates[0];
    const pl=(arr,dir)=>arr.map((p,i)=>`<span class="plate" style="--w:${p>=10?16:12}px;--h:${36+p/mxp*96}px;--pc:${P.col[String(p)]};--i:${i};--dx:${dir*30}px"></span>`).join('');
    $('#plViz',b).innerHTML=`<div class="barl"></div><div class="sleeve"><span class="collar"></span>${pl(used.slice().reverse(),-1)}</div><div style="width:28%"></div><div class="sleeve">${pl(used,1)}<span class="collar"></span></div>`;
    const counts={};used.forEach(p=>counts[p]=(counts[p]||0)+1);
    $('#plList',b).innerHTML=Object.keys(counts).sort((a,b2)=>b2-a).map(p=>`<span><i style="--pc:${P.col[String(p)]}"></i>${counts[p]} × ${fmtInput(+p)}</span>`).join('');
    $('#plSum',b).innerHTML=target<bar?esc(t('belowBar')):esc(t('perSide'))+': <b class="num" style="color:var(--text)">'+fmtInput(used.reduce((a,x)=>a+x,0))+' '+u+'</b>'+(Math.abs(loaded-target)>1e-6?' · '+esc(t('closest',{v:fmtInput(loaded)+' '+u})):'');
  };
  seg($('#plBar',b),String(bar),v=>{bar=parseFloat(v);calc()});
  $('#plT',b).addEventListener('input',calc);calc();
}
function openOrm(){
  const u=UNIT(),cw=parseNum($('#inWeight').value),cr=parseInt($('#inReps').value,10);
  const b=openSheet({title:t('toolOrm'),body:`<div class="two form-row"><div><label class="label" for="oW">${esc(t('weight'))} (${u})</label><input class="input num" id="oW" inputmode="decimal" value="${cw>0?fmtInput(cw):''}" placeholder="0" style="font-size:20px;font-weight:750"></div><div><label class="label" for="oR">${esc(t('reps'))}</label><input class="input num" id="oR" inputmode="numeric" value="${cr>0?cr:''}" placeholder="0" style="font-size:20px;font-weight:750"></div></div><div class="big-num num" id="oVal">–</div><div class="big-sub" id="oSub">${esc(t('ormHint'))}</div><div class="pct-table" id="oTab"></div>`});
  const calc=()=>{const w=parseNum($('#oW',b).value),r=parseInt($('#oR',b).value,10);
    if(!(w>0&&r>0)){$('#oVal',b).textContent='–';$('#oTab',b).innerHTML='';return}
    const brz=r<37?w*36/(37-r):w,ep=w*(1+r/30),est=r===1?w:(r<=12?brz:ep);
    $('#oVal',b).textContent=fmtInput(Math.round(est*10)/10)+' '+u;
    $('#oSub',b).textContent='Brzycki '+fmtInput(Math.round(brz*10)/10)+' · Epley '+fmtInput(Math.round(ep*10)/10);
    const rp={95:2,90:4,85:6,80:8,75:10,70:12,65:15,60:18,50:25};
    $('#oTab',b).innerHTML=[95,90,85,80,75,70,65,60,50].map(p=>`<div><b class="num">${fmtInput(Math.round(est*p/100*2)/2)}</b><span>${p}% · ~${rp[p]} ${esc(t('repsShort'))}</span></div>`).join('');
  };
  b.oninput=calc;calc();
}
function openLadder(){
  const cur=rankOf(totalXp);let html='';
  RANKS.forEach((r,i)=>{if(r.sub===1)html+=`<div class="lad-tier">${esc(tierName(r.tier))}</div>`;
    html+=`<div class="lad${i===cur?' cur':''}${i>cur?' locked':''}" style="--tier:${tierColor(r.tier)}" ${i===cur?'id="ladCur"':''}>${emblem(i)}<div class="lad-main"><div class="lad-name${r.tier===10?' tier-fire':''}">${esc(rankName(i))}</div><div class="lad-xp">${fmtN(r.xp)} XP</div></div>${i===cur?`<span class="pill accent">${esc(t('you'))}</span>`:i<cur?`<span class="dim">${ico('check','sm')}</span>`:''}</div>`});
  const b=openSheet({title:t('rankLadder'),tall:true,body:`<p class="sheet-text" style="font-size:13.5px">${esc(t('ladderInfo'))}</p><div class="ladder">${html}</div>`});
  setTimeout(()=>{const c=$('#ladCur',b);if(c)c.scrollIntoView({block:'center',behavior:reduceMotion()?'auto':'smooth'})},380);
}

/* ---------- Celebration ---------- */
function celebrate(i){
  const c=$('#celebrate'),r=RANKS[i];
  c.style.setProperty('--tier',TIERS[r.tier].c[1]);
  $('#celEmb').innerHTML=emblem(i);$('#celEyebrow').textContent=t('rankUp');
  const n=$('#celName');n.textContent=rankName(i);n.classList.toggle('tier-fire',r.tier===10);
  $('#celSub').textContent=RANKS[i+1]?t('rankUpSub',{xp:fmtN(Math.max(0,RANKS[i+1].xp-totalXp)),rank:rankName(i+1)}):t('maxRank');
  $('#celBtn').textContent=t('continue');
  c.classList.remove('show');void c.offsetWidth;c.classList.add('show');
  haptic([20,60,30,60,90]);SFX.rank();burst(TIERS[r.tier].c.concat(['#ffffff']));
  setTimeout(()=>$('#celBtn').focus({preventScroll:true}),900);
}
const closeCelebrate=()=>$('#celebrate').classList.remove('show');
function burst(colors){
  if(reduceMotion())return;
  const cv=$('#fx'),ctx=cv.getContext('2d'),dpr=Math.min(2,devicePixelRatio||1),W=innerWidth,H=innerHeight;
  cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  const cx=W/2,cy=H/2-80,P=[];
  for(let i=0;i<180;i++){const a=Math.random()*Math.PI*2,s=3+Math.random()*11;P.push({x:cx,y:cy,vx:Math.cos(a)*s,vy:Math.sin(a)*s-4,r:2.5+Math.random()*4.5,c:colors[i%colors.length],rot:Math.random()*6,vr:(Math.random()-.5)*.35,sh:i%3,life:1,d:.005+Math.random()*.008})}
  const t0=performance.now();
  (function f(){ctx.clearRect(0,0,W,H);let alive=0;
    for(const p of P){if(p.life<=0)continue;alive++;p.vx*=.986;p.vy=p.vy*.986+.16;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;p.life-=p.d;
      ctx.save();ctx.globalAlpha=Math.max(0,p.life);ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.c;
      if(p.sh===0)ctx.fillRect(-p.r,-p.r/3,p.r*2,p.r/1.5);else if(p.sh===1){ctx.beginPath();ctx.arc(0,0,p.r/1.5,0,6.283);ctx.fill()}else{ctx.beginPath();ctx.moveTo(0,-p.r);ctx.lineTo(p.r*.85,p.r*.6);ctx.lineTo(-p.r*.85,p.r*.6);ctx.closePath();ctx.fill()}
      ctx.restore()}
    if(alive&&performance.now()-t0<6000)requestAnimationFrame(f);else ctx.clearRect(0,0,W,H)})();
}

/* ============================================================
   NAVIGATION
   ============================================================ */
const PAGES=['train','library','history','progress','settings'];
const LEGACY={home:'train',exercises:'library',stats:'progress',body:'progress'};
let PAGE=null;const scrollMem={};let titleObs=null;
function renderPage(p){({train:renderTrain,library:renderLibrary,history:renderHistory,progress:renderProgress,settings:renderSettings})[p]()}
function renderAll(){renderPage(PAGE||'train');if(PAGE!=='train')renderTrain()}
function go(p){
  p=LEGACY[p]||p;if(!PAGES.includes(p))p='train';
  if(p===PAGE){window.scrollTo({top:0,behavior:reduceMotion()?'auto':'smooth'});return}
  if(PAGE)scrollMem[PAGE]=scrollY;
  PAGE=p;
  $$('.page').forEach(s=>s.classList.toggle('active',s.id==='page-'+p));
  $$('.tab').forEach(b=>{const on=b.dataset.page===p;b.classList.toggle('on',on);b.setAttribute('aria-selected',on)});
  moveTabInd(true);
  renderPage(p);
  const el=$('#page-'+p);[...el.children].forEach((c,i)=>c.style.setProperty('--i',i));
  el.classList.remove('in');void el.offsetWidth;el.classList.add('in');
  window.scrollTo(0,scrollMem[p]||0);
  if(location.hash!=='#'+p)history.replaceState(null,'','#'+p);
  $('#navbarTitle').textContent=t(el.dataset.title);
  if(titleObs){titleObs.disconnect();titleObs.observe($('.ph-title',el))}
  requestAnimationFrame(syncSegs);
}
function moveTabInd(anim){
  const on=$('.tab.on'),ind=$('#tabInd');if(!on||!on.offsetWidth)return;
  if(!anim)ind.style.transition='none';
  ind.style.width=on.offsetWidth+'px';ind.style.height=on.offsetHeight+'px';ind.style.transform=`translate(${on.offsetLeft}px,${on.offsetTop}px)`;
  if(!anim){void ind.offsetWidth;ind.style.transition=''}
}

/* ============================================================
   INIT
   ============================================================ */
function bindGlobal(){
  $('#tabbar').addEventListener('click',e=>{const b=e.target.closest('.tab');if(b){haptic(4);go(b.dataset.page)}});
  $('#picker').addEventListener('click',openPicker);
  $('#btnLog').addEventListener('click',logSet);
  $('#recentRow').addEventListener('click',e=>{const c=e.target.closest('[data-ex]');if(c){haptic(5);selectEx(c.dataset.ex)}});
  $('#hero').addEventListener('click',openLadder);
  $('#hero').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openLadder()}});
  $('#streakPill').addEventListener('click',()=>{const s=liveStreak();toast(t('streakInfo',{n:s,best:getStreak().longest||0}),{icon:'flame',sub:t('streakRule')})});
  $$('.tool').forEach(b=>b.addEventListener('click',()=>({timer:openTimerSheet,plates:openPlates,orm:openOrm})[b.dataset.tool]()));
  $('#tpAdd').addEventListener('click',()=>{TMR.end+=30000;TMR.total+=30;LS.set('gr_tEnd',TMR.end);LS.set('gr_tTot',TMR.total);tickTimer();haptic(5)});
  $('#tpSkip').addEventListener('click',()=>{stopTimer();haptic(5)});
  $('#celBtn').addEventListener('click',closeCelebrate);
  $('#celebrate').addEventListener('click',e=>{if(e.target===e.currentTarget)closeCelebrate()});
  $('#histMore').addEventListener('click',()=>{histDays+=14;renderHistory()});
  // delegated actions across pages
  $('#main').addEventListener('click',e=>{
    const g=e.target.closest('[data-go]');if(g){go(g.dataset.go);return}
    const d=e.target.closest('[data-detail]');if(d){openExDetail(d.dataset.detail);return}
    const h=e.target.closest('.h-row[data-ts]');if(h){openSetSheet(parseInt(h.dataset.ts,10));return}
    const m=e.target.closest('[data-muscle]');if(m&&PAGE==='progress'){openMuscleSheet(m.dataset.muscle)}
  });
  $('#todayList').addEventListener('keydown',e=>{const d=e.target.closest('[data-detail]');if(d&&(e.key==='Enter'||e.key===' ')){e.preventDefault();openExDetail(d.dataset.detail)}});
  document.addEventListener('keydown',e=>{
    const el=document.activeElement,typing=el&&(/INPUT|TEXTAREA|SELECT/.test(el.tagName)||el.isContentEditable);
    if(e.key==='Escape'){if($('#celebrate').classList.contains('show'))closeCelebrate();else if(SH.open)closeSheet();return}
    if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();if(PAGE!=='train')go('train');openPicker();return}
    if(typing){
      if(e.key==='Enter'&&el.id==='inWeight'){e.preventDefault();$('#inReps').focus()}
      else if(e.key==='Enter'&&el.id==='inReps'){e.preventDefault();logSet()}
      else if((e.key==='ArrowUp'||e.key==='ArrowDown')&&(el.id==='inWeight'||el.id==='inReps')){e.preventDefault();stepValue(el.id==='inWeight'?'w':'r',e.key==='ArrowUp'?1:-1)}
      return;
    }
    if(SH.open||e.metaKey||e.ctrlKey||e.altKey)return;
    if(e.key==='/'){e.preventDefault();if(PAGE!=='train')go('train');openPicker()}
    else if(/^[1-5]$/.test(e.key))go(PAGES[parseInt(e.key,10)-1]);
    else if(e.key.toLowerCase()==='t'){TMR.end?stopTimer():startTimer()}
  });
  window.addEventListener('hashchange',()=>go(location.hash.slice(1)));
  let rz;window.addEventListener('resize',()=>{moveTabInd(false);syncSegs();clearTimeout(rz);rz=setTimeout(()=>{if(PAGE==='progress'&&PROG==='overview')mountXpChart(getHistory())},200)});
  matchMedia('(prefers-color-scheme: light)').addEventListener('change',()=>{if(THEME()===document.documentElement.dataset.theme)return;applyTheme();if(PAGE==='settings')renderSettings()});
  matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change',()=>{if(PAGE==='settings')renderSettings()});
  window.addEventListener('languagechange',()=>{if(pref.lang==='system')applyLang()});
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState!=='visible')return;const lost=applyDecay();if(lost>0)toast(t('laziness',{xp:fmtN(lost)}),{type:'bad',icon:'flame'});currentRankIndex=rankOf(totalXp);if(TMR.end)tickTimer();if(PAGE==='train')renderTrain()});
  setInterval(()=>{if(PAGE==='train'&&!document.hidden)renderHero()},60000);
  titleObs=new IntersectionObserver(es=>es.forEach(en=>$('#navbar').classList.toggle('show',!en.isIntersecting&&en.boundingClientRect.top<0)),{rootMargin:'-44px 0px 0px 0px'});
}
function splash(){
  const s=$('#splash');let seen=false;try{seen=sessionStorage.getItem('gr_splash')}catch(e){}
  if(seen||reduceMotion()){s.remove();return}
  try{sessionStorage.setItem('gr_splash','1')}catch(e){}
  setTimeout(()=>{s.classList.add('out');setTimeout(()=>s.remove(),600)},1050);
}
function init(){
  migrateData();loadState();rebuildEx();
  LANG=resolveLang();buildFormatters();applyTheme();applyStatic();
  $('#brandLogo').innerHTML=logoSVG();
  const prevRank=rankOf(totalXp),lost=applyDecay();currentRankIndex=rankOf(totalXp);
  initSheetDrag();initSteppers();initLibrary();initSettings();bindGlobal();
  if(SEL&&getEx(SEL)){const last=lastSet(SEL);if(last){$('#inWeight').value=fmtInput(toDisp(last.weight));$('#inReps').value=last.reps}}
  go(location.hash.slice(1)||'train');
  requestAnimationFrame(()=>moveTabInd(false));
  const te=parseInt(LS.get('gr_tEnd','0'),10);if(te>Date.now()){TMR.end=te;TMR.total=parseInt(LS.get('gr_tTot',pref.timer),10)||pref.timer;runTimer()}else LS.del('gr_tEnd');
  splash();
  if(lost>0)setTimeout(()=>{toast(t('laziness',{xp:fmtN(lost)}),{type:'bad',icon:'flame',sub:t('decayRule'),dur:5000});if(currentRankIndex<prevRank)setTimeout(()=>toast(t('derank',{rank:rankName(currentRankIndex)}),{type:'bad',icon:'chart'}),600)},1300);
  if('serviceWorker' in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
init();
</script>
