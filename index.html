<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">

<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark light">

<meta property="og:description" content="300+ Übungen. Logge Sätze, farme XP und steige von Holz bis Champion auf.">
<meta property="og:image" content="https://emre1001.github.io/Gym-Ranker/icon.png">
<meta property="og:url" content="https://emre1001.github.io/Gym-Ranker/">
<meta name="twitter:card" content="summary">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">

<script>(function(){try{var t=localStorage.getItem('gr_theme');if(t!=='light'&&t!=='dark')t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';document.documentElement.setAttribute('data-theme',t)}catch(e){document.documentElement.setAttribute('data-theme','dark')}})()</script>
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/features.css">
</head>
<body>
<div id="splash" aria-hidden="true">
  <svg class="splash-logo" viewBox="0 0 64 64">
    <defs><linearGradient id="spG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff5a36"/><stop offset="1" stop-color="#ec3a1c"/></linearGradient></defs>
    <path class="lg-badge" d="M32 5.5 54.5 18.5V45.5L32 58.5 9.5 45.5V18.5Z" fill="url(#spG)" stroke="url(#spG)" stroke-width="6" stroke-linejoin="round"/>
    <g class="lg-chev c3" fill="#fff"><path d="M13 40.4h38v2.8H13z"/><rect x="17.2" y="35.6" width="4.4" height="12.4" rx="1.5"/><rect x="42.4" y="35.6" width="4.4" height="12.4" rx="1.5"/><rect x="13.4" y="37.6" width="2.9" height="8.4" rx="1.1"/><rect x="47.7" y="37.6" width="2.9" height="8.4" rx="1.1"/></g>
    <path class="lg-chev c2" d="M24.5 31 32 24.5 39.5 31" fill="none" stroke="#fff" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round"/>
    <path class="lg-chev c1" d="M24.5 23 32 16.5 39.5 23" fill="none" stroke="#fff" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round" stroke-opacity=".55"/>
  </svg>
</div>

<header class="navbar" id="navbar" aria-hidden="true"><span id="navbarTitle"></span></header>

<main class="main" id="main">

<!-- ================= TRAIN ================= -->
<section class="page" id="page-train" data-title="navTrain">
  <div class="ph">
    <div class="ph-main"><div class="ph-eyebrow" id="todayDate"></div><h1 class="ph-title" id="helloTitle"></h1><p class="ph-sub" id="motd"></p></div>
    <div class="ph-actions"><button class="streak-pill" id="streakPill" aria-label="Streak"><svg class="ico sm"><use href="#i-flame"/></svg><span class="num" id="streakNum">0</span></button></div>
  </div>
  <div class="grid-train">
    <div class="col">
      <article class="card hero o1" id="hero" role="button" tabindex="0" aria-describedby="heroNext">
        <div class="hero-top">
          <div class="hero-emblem">
            <svg class="ring" viewBox="0 0 100 100"><circle class="ring-bg" cx="50" cy="50" r="46"/><circle class="ring-fg" id="heroRing" cx="50" cy="50" r="46" pathLength="100"/></svg>
            <div id="heroEmblem"></div>
          </div>
          <div class="hero-info">
            <div class="eyebrow" data-i18n="rankTitle"></div>
            <div class="hero-rank" id="heroRank"></div>
            <div class="hero-xp"><b class="num" id="heroXp">0</b> XP</div>
          </div>
          <svg class="ico sm hero-chev"><use href="#i-chev-r"/></svg>
        </div>
        <div class="bar"><i id="heroBar"></i></div>
        <div class="hero-foot"><span id="heroNext"></span><span id="heroStatus"></span></div>
      </article>
      <article class="card quest-card o3" id="questCard">
        <div class="card-head"><h2 class="card-title"><svg class="ico sm"><use href="#i-quest"/></svg><span data-i18n="dailyQuests"></span></h2><span class="card-sub" id="questSub"></span></div>
        <div id="questList"></div>
        <button class="quest chest" id="chestRow"></button>
      </article>
      <article class="card quest-card weekly o5" id="weekCard">
        <div class="card-head"><h2 class="card-title"><svg class="ico sm"><use href="#i-crown"/></svg><span data-i18n="weeklyQuests"></span></h2><span class="card-sub" id="weekSub"></span></div>
        <div id="weekList"></div>
      </article>
      <article class="card o6" id="todayCard">
        <div class="card-head"><h2 class="card-title" data-i18n="today"></h2><span class="card-sub" id="todaySub"></span></div>
        <div class="today-top">
          <div class="goal-ring" id="goalRing">
            <svg viewBox="0 0 100 100"><circle class="ring-bg" cx="50" cy="50" r="42"/><circle class="ring-fg" id="goalRingFg" cx="50" cy="50" r="42" pathLength="100"/></svg>
            <div class="gr-text"><div><b class="num" id="todaySets">0</b><small id="todaySetsLbl"></small></div></div>
          </div>
          <div class="today-stats">
            <div class="kv"><b class="num" id="todayXp">0</b><span>XP</span></div>
            <div class="kv"><b class="num" id="todayEx">0</b><span data-i18n="exercises"></span></div>
            <div class="kv"><b class="num" id="todayVol">0</b><span data-i18n="volume"></span></div>
            <div class="kv"><b class="num" id="todayTime">–</b><span data-i18n="duration"></span></div>
          </div>
        </div>
        <div class="today-list" id="todayList"></div>
      </article>
    </div>
    <div class="col">
      <article class="card o2" id="logger">
        <div class="card-head"><h2 class="card-title" data-i18n="logTitle"></h2><span class="pill neutral" id="setNo" hidden></span></div>
        <button class="picker unset" id="picker" aria-haspopup="dialog">
          <span class="ph-ico" id="pickerTile"><svg class="ico"><use href="#i-search"/></svg></span>
          <span class="picker-main"><span class="picker-name" id="pickerName"></span><span class="picker-sub" id="pickerSub"></span></span>
          <kbd>/</kbd>
          <svg class="ico sm dim"><use href="#i-chev-r"/></svg>
        </button>
        <div class="recent chips" id="recentRow"></div>
        <div class="steppers">
          <div class="field"><div class="field-head"><label for="inWeight" id="lblWeight"></label></div>
            <div class="stepper"><button type="button" data-step="w-1" aria-label="−"><svg class="ico"><use href="#i-minus"/></svg></button><input id="inWeight" type="text" inputmode="decimal" placeholder="0" autocomplete="off" enterkeyhint="next"><button type="button" data-step="w1" aria-label="+"><svg class="ico"><use href="#i-plus"/></svg></button></div>
          </div>
          <div class="field"><div class="field-head"><label for="inReps" id="lblReps"></label><button type="button" class="sw-btn" id="swBtn" hidden aria-pressed="false"><svg class="ico xs"><use href="#i-timer"/></svg><span id="swLbl" data-i18n="stopwatch"></span></button></div>
            <div class="stepper"><button type="button" data-step="r-1" aria-label="−"><svg class="ico"><use href="#i-minus"/></svg></button><input id="inReps" type="text" inputmode="numeric" placeholder="0" autocomplete="off" enterkeyhint="done"><button type="button" data-step="r1" aria-label="+"><svg class="ico"><use href="#i-plus"/></svg></button></div>
          </div>
        </div>
        <p class="mode-hint" id="modeHint" hidden></p>
        <div class="preview" id="preview"></div>
        <button class="btn btn-primary btn-log" id="btnLog"><span class="btn-label"><svg class="ico sm"><use href="#i-bolt"/></svg><span data-i18n="logSet"></span></span><svg class="btn-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
        <div class="log-hint" data-i18n="logHint"></div>
      </article>
      <article class="card day-card o4" id="dayCard">
        <div class="card-head"><h2 class="card-title" data-i18n="dayOverview"></h2></div>
        <div class="day-tiles" id="dayTiles"></div>
      </article>
      <div class="tools o7">
        <button class="tool" data-tool="timer"><span class="t-ico" style="background:#ff9f0a"><svg class="ico sm"><use href="#i-timer"/></svg></span><span><span data-i18n="toolTimer"></span><small id="toolTimerSub"></small></span></button>
        <button class="tool" data-tool="plates"><span class="t-ico" style="background:#0a84ff"><svg class="ico sm"><use href="#i-plate"/></svg></span><span><span data-i18n="toolPlates"></span><small data-i18n="toolPlatesSub"></small></span></button>
        <button class="tool" data-tool="orm"><span class="t-ico" style="background:#bf5af2"><svg class="ico sm"><use href="#i-gauge"/></svg></span><span><span data-i18n="toolOrm"></span><small data-i18n="toolOrmSub"></small></span></button>
        <button class="tool" data-tool="skills"><span class="t-ico" style="background:#14bfc2"><svg class="ico sm"><use href="#i-spark"/></svg></span><span><span data-i18n="skills"></span><small id="toolSkillsSub"></small></span></button>
      </div>
    </div>
  </div>
</section>

<!-- ================= FOOD ================= -->
<section class="page" id="page-food" data-title="navFood">
  <div class="ph">
    <div class="ph-main"><div class="ph-eyebrow" id="foodEyebrow"></div><h1 class="ph-title" data-i18n="titleFood"></h1></div>
    <div class="ph-actions day-nav"><button class="icon-btn" id="foodPrev" data-i18n-aria="prevDay"><svg class="ico sm"><use href="#i-chev-l"/></svg></button><span id="foodDayLbl" class="num"></span><button class="icon-btn" id="foodNext" data-i18n-aria="nextDay"><svg class="ico sm"><use href="#i-chev-r"/></svg></button></div>
  </div>
  <div id="foodView"></div>
</section>

<!-- ================= BODY ================= -->
<section class="page" id="page-body" data-title="navBody">
  <div class="ph">
    <div class="ph-main"><div class="ph-eyebrow" id="bodyEyebrow"></div><h1 class="ph-title" data-i18n="titleBody"></h1></div>
  </div>
  <div id="bodyView"></div>
</section>

<!-- ================= LIBRARY ================= -->
<section class="page" id="page-library" data-title="navLibrary">
  <div class="ph">
    <div class="ph-main"><button class="back-btn" data-back data-i18n-aria="goBack"><svg class="ico sm"><use href="#i-chev-l"/></svg><span data-i18n="navProfile"></span></button><div class="ph-eyebrow" id="libEyebrow"></div><h1 class="ph-title" data-i18n="titleLibrary"></h1></div>
    <div class="ph-actions"><button class="btn btn-secondary btn-sm" id="btnNewEx"><svg class="ico xs"><use href="#i-plus"/></svg><span data-i18n="newExercise"></span></button></div>
  </div>
  <div class="lib-tools">
    <div class="search" id="libSearchWrap"><svg class="ico sm"><use href="#i-search"/></svg><input id="libSearch" type="search" autocomplete="off" data-i18n-ph="searchPh"><button class="clear" aria-label="Clear"><svg class="ico xs"><use href="#i-x"/></svg></button></div>
    <div class="chips" id="muscleChips"></div>
    <div class="chips" id="equipChips"></div>
  </div>
  <div class="lib-meta"><span id="libCount"></span><button class="chip" id="favChip"><svg class="ico xs"><use href="#i-star"/></svg><span data-i18n="favorites"></span></button></div>
  <div class="list stagger" id="libList"></div>
  <button class="btn btn-secondary btn-sm more-btn" id="libMore" hidden></button>
</section>

<!-- ================= HISTORY ================= -->
<section class="page" id="page-history" data-title="navHistory">
  <div class="ph">
    <div class="ph-main"><button class="back-btn" data-back data-i18n-aria="goBack"><svg class="ico sm"><use href="#i-chev-l"/></svg><span data-i18n="navProfile"></span></button><div class="ph-eyebrow" id="histEyebrow"></div><h1 class="ph-title" data-i18n="titleHistory"></h1></div>
  </div>
  <div id="histList"></div>
  <button class="btn btn-secondary btn-sm more-btn" id="histMore" hidden></button>
</section>

<!-- ================= PROGRESS ================= -->
<section class="page" id="page-progress" data-title="navProgress">
  <div class="ph">
    <div class="ph-main"><div class="ph-eyebrow" id="progEyebrow"></div><h1 class="ph-title" data-i18n="titleProgress"></h1></div>
  </div>
  <div class="seg lg" id="progSeg" style="margin-bottom:16px">
    <button data-v="overview" data-i18n="segOverview"></button>
    <button data-v="body" data-i18n="segBody"></button>
    <button data-v="skills" data-i18n="skills"></button>
    <button data-v="records" data-i18n="segRecords"></button>
  </div>
  <div id="progView"></div>
</section>

<!-- ================= PROFILE ================= -->
<section class="page" id="page-profile" data-title="navProfile">
  <div class="ph">
    <div class="ph-main"><div class="ph-eyebrow" id="profEyebrow"></div><h1 class="ph-title" data-i18n="titleProfile"></h1></div>
  </div>
  <div id="profileView"></div>
</section>

<!-- ================= SETTINGS ================= -->
<section class="page" id="page-settings" data-title="navSettings">
  <div class="ph">
    <div class="ph-main"><button class="back-btn" data-back data-i18n-aria="goBack"><svg class="ico sm"><use href="#i-chev-l"/></svg><span data-i18n="navProfile"></span></button><div class="ph-eyebrow">Gym Ranker</div><h1 class="ph-title" data-i18n="titleSettings"></h1></div>
  </div>
  <div class="settings-wrap" id="settingsView"></div>
</section>

</main>

<!-- ================= TAB BAR / SIDEBAR ================= -->
<nav class="tabbar" id="tabbar" aria-label="Navigation">
  <div class="brand"><span id="brandLogo"></span><div>Gym Ranker<small>Hardcore</small></div></div>
  <div class="tabs" role="tablist">
    <span class="tab-ind" id="tabInd"></span>
    <button class="tab" role="tab" data-page="train"><svg class="ico"><use href="#i-train"/></svg><span data-i18n="navTrain"></span></button>
    <button class="tab" role="tab" data-page="food"><svg class="ico"><use href="#i-food"/></svg><span data-i18n="navFood"></span></button>
    <button class="tab" role="tab" data-page="body"><svg class="ico"><use href="#i-body"/></svg><span data-i18n="navBody"></span></button>
    <button class="tab" role="tab" data-page="progress"><svg class="ico"><use href="#i-chart"/></svg><span data-i18n="navProgress"></span></button>
    <button class="tab side" role="tab" data-page="library"><svg class="ico"><use href="#i-library"/></svg><span data-i18n="navLibrary"></span></button>
    <button class="tab side" role="tab" data-page="history"><svg class="ico"><use href="#i-history"/></svg><span data-i18n="navHistory"></span></button>
    <button class="tab" role="tab" data-page="profile"><svg class="ico"><use href="#i-user"/></svg><span data-i18n="navProfile"></span></button>
    <button class="tab side" role="tab" data-page="settings"><svg class="ico"><use href="#i-sliders"/></svg><span data-i18n="navSettings"></span></button>
  </div>
  <div class="side-foot" id="sideFoot"></div>
</nav>

<!-- ================= OVERLAYS ================= -->
<div class="timer-pill" id="timerPill" role="timer" aria-live="off">
  <div class="tp-ring"><svg viewBox="0 0 44 44"><circle class="bg" cx="22" cy="22" r="18"/><circle class="fg" id="tpFg" cx="22" cy="22" r="18" pathLength="100"/></svg><svg class="ico"><use href="#i-timer"/></svg></div>
  <div><span class="tp-label" data-i18n="rest"></span><span class="tp-time" id="tpTime">0:00</span></div>
  <button class="tp-btn" id="tpAdd">+30</button>
  <button class="tp-btn" id="tpSkip" aria-label="Skip"><svg class="ico sm"><use href="#i-x"/></svg></button>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<div class="sheet-backdrop" id="sheetBackdrop"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" tabindex="-1">
  <div class="sheet-grab" id="sheetGrab"><span class="grabber"></span><div class="sheet-head"><h3 id="sheetTitle"></h3><button class="icon-btn" id="sheetClose" aria-label="Close"><svg class="ico sm"><use href="#i-x"/></svg></button></div></div>
  <div class="sheet-body" id="sheetBody"></div>
</div>

<div class="celebrate" id="celebrate" role="dialog" aria-modal="true">
  <canvas id="fx"></canvas>
  <div class="cel-inner">
    <div class="cel-emb"><div class="cel-rays"></div><div class="emb-wrap" id="celEmb"></div></div>
    <div class="cel-eyebrow" id="celEyebrow"></div>
    <div class="cel-name" id="celName"></div>
    <div class="cel-sub" id="celSub"></div>
    <button class="btn" id="celBtn"></button>
  </div>
</div>

<input type="file" id="fileImport" accept="application/json,.json,.txt" hidden>

<!-- ================= ICONS ================= -->
